<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Juego</title>
  <link rel="stylesheet" href="style-4.css" />
</head>
<body>
  <div id="gameWrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="touchControls" aria-label="Controles táctiles">
      <div class="touch-side touch-left">
        <button id="btnLeft" class="touch-btn">←</button>
        <button id="btnRight" class="touch-btn">→</button>
      </div>

      <div class="touch-side touch-right">
        <button id="btnJump" class="touch-btn">⤒</button>
        <button id="btnAction" class="touch-btn">⤓</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
