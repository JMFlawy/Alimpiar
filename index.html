<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Limpia, limpia!</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>

  <div id="touchControls" aria-label="Controles táctiles">
    <div class="touch-side touch-left">
      <button id="btnLeft" class="touch-btn" type="button">←</button>
      <button id="btnRight" class="touch-btn" type="button">→</button>
    </div>

    <div class="touch-side touch-right">
      <button id="btnJump" class="touch-btn" type="button">▲</button>
      <button id="btnAction" class="touch-btn" type="button">✋</button>
    </div>
  </div>
</div>

  <script type="module" src="main.js"></script>

</body>
</html>
